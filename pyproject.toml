[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fleetwright"
version = "0.2.0"
description = "Self-hosted agent operations OS — a persistent fleet of AI agents with a supervision cockpit"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["ai", "agents", "orchestration", "claude", "fleet", "autonomous"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.optional-dependencies]
supabase = ["supabase>=2.4"]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "mkdocs-material>=9.5",
]

[project.scripts]
fleetwright-fleet   = "fleetwright.fleet.fleet:_main"
fleetwright-recon   = "fleetwright.fleet.run_reconciler:_main"
fleetwright-drain   = "fleetwright.fleet.drainer:_main"
fleetwright-bridge  = "fleetwright.bridge.main:_main"

[project.urls]
Homepage = "https://github.com/jddavenportOpen/fleetwright"
Documentation = "https://fleetwright.dev"
Issues = "https://github.com/jddavenportOpen/fleetwright/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["fleetwright*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
